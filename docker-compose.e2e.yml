name: oghmanotes-e2e

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: oghma_e2e
      POSTGRES_PASSWORD: oghma_e2e
      POSTGRES_DB: oghma_e2e
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oghma_e2e -d oghma_e2e"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - e2e-postgres:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    ports:
      - "56380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "56333:6333"
      - "56334:6334"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/127.0.0.1/6333'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - e2e-qdrant:/qdrant/storage

  rustfs:
    image: ghcr.io/rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: oghmae2e
      RUSTFS_SECRET_KEY: oghmae2e-secret
      RUSTFS_CORS_ALLOWED_ORIGINS: ${RUSTFS_CORS_ALLOWED_ORIGINS:-http://127.0.0.1:3310,http://127.0.0.1:3311}
    ports:
      - "59100:9000"
      - "59101:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - e2e-rustfs:/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "58125:1025"
      - "58180:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 30

  fake-ai:
    build:
      context: .
      dockerfile: Dockerfile.e2e-fake-ai
    ports:
      - "58181:8081"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  e2e-postgres:
  e2e-rustfs:
  e2e-qdrant:
