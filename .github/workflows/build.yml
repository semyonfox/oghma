name: Build

on:
  pull_request:
    branches: [main, dev, production]
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Select web checks
        id: changes
        run: |
          node --test scripts/select-ci-checks.test.mjs
          node scripts/select-ci-checks.mjs

      - name: Set up Node.js
        if: steps.changes.outputs.checks != '[]'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: steps.changes.outputs.checks != '[]'
        run: npm ci

      - name: Lint
        if: contains(fromJSON(steps.changes.outputs.checks), 'lint')
        run: npm run lint
        continue-on-error: false

      - name: i18n audit
        if: contains(fromJSON(steps.changes.outputs.checks), 'web')
        run: npm run i18n:audit
        continue-on-error: false

      - name: Build
        if: contains(fromJSON(steps.changes.outputs.checks), 'web')
        run: npm run build
        continue-on-error: false
        env:
          SERVER_ENCRYPTION_SECRET: ${{ secrets.SERVER_ENCRYPTION_SECRET || 'ci-build-placeholder' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-build-placeholder' }}
          NEXTAUTH_URL: http://localhost:3000
          # The running queue facade defaults to BullMQ; no AWS SQS build
          # placeholders are consumed by the application anymore.
          QUEUE_PROVIDER: bullmq
          QUEUE_PREFIX: ci
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          DATABASE_URL: postgresql://localhost:5432/ci
