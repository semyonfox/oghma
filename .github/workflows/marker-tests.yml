name: Marker unit tests

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "oghma_marker/**"
      - "scripts/tests/test_openai_compatible_vision.py"
      - "infra/marker-worker/**"
      - "infra/runpod-marker/**"
      - "infra/vast-marker/**"
      - "scripts/build-*-marker-image.sh"
      - "scripts/build-marker-worker-image.sh"
      - "scripts/package-marker-plus-plus.sh"
      - "package.json"
      - ".github/workflows/marker-tests.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  marker-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: infra/runpod-marker/requirements-test.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install marker unit-test dependencies
        run: python -m pip install --requirement infra/runpod-marker/requirements-test.txt

      - name: Check active Marker entrypoints and run unit tests
        run: npm run test:marker
