version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "cron"
      cronjob: "0 6 * * *"
      timezone: "Europe/Dublin"
    open-pull-requests-limit: 99
    versioning-strategy: "increase"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      major-dependencies:
        update-types:
          - "major"
      security-dependencies:
        applies-to: "security-updates"
        patterns:
          - "*"
    ignore:
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      # types track the oldest node major in engines; newer ones type-check APIs that crash on it
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    reviewers:
      - "semyonfox"
    assignees:
      - "semyonfox"
  - package-ecosystem: "npm"
    directory: "/src/lib/canvas-mcp"
    target-branch: "dev"
    schedule:
      interval: "cron"
      cronjob: "15 6 * * *"
      timezone: "Europe/Dublin"
    open-pull-requests-limit: 99
    versioning-strategy: "increase"
    commit-message:
      prefix: "deps(canvas-mcp)"
      include: "scope"
    groups:
      canvas-mcp-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      canvas-mcp-major-dependencies:
        update-types:
          - "major"
      canvas-mcp-security-dependencies:
        applies-to: "security-updates"
        patterns:
          - "*"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    reviewers:
      - "semyonfox"
    assignees:
      - "semyonfox"
  - package-ecosystem: docker
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: weekly
    # runtime majors are deliberate upgrades: node stays on an LTS line and python on
    # the version the GPU stack ships wheels for
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
